name: Secure Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    # No env secrets defined here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g sass
      - run: sass tw-static.scss tw-static.css --style compressed
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-css
          path: tw-static.css
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-css
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: tw-static.css
        env:
          # Token is ONLY available in this isolated job
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
